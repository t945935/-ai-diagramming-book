name: 範例無法執行或開啟
description: 提供環境與重現步驟，以便定位問題
title: "[範例問題] "
body:
  - type: input
    id: example
    attributes:
      label: 範例路徑與版本／commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 作業系統、工具與渲染器版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 附上使用的指令或操作步驟。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 預期結果、實際結果與錯誤訊息
      description: 可以附匿名化截圖；不要上傳憑證或客戶資料。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私確認
      options:
        - label: 我已移除敏感資訊，並搜尋過既有問題。
          required: true
