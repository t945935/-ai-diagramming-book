name: Core diagram contracts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # resolved from v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Record runner tools
        run: |
          python3 --version
          make --version
      - name: Check dependency and shared endpoint contracts
        run: make check-core
